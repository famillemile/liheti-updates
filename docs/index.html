      fetch(source,{cache:'no-store'})
        .then(function(response){ if(!response.ok) throw new Error('version.json indisponible'); return response.json(); })
        .then(function(data){ releaseData=data; renderRelease(releaseData); })
        .catch(function(error){ console.warn('LIHETI : informations locales conservées',error); });
    }

    setLang('fr');
    loadCurrentDownloads();
  </script>
</body>
</html>
